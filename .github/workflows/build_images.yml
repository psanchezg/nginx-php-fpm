---
name: 'build images'

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            php_version: '8.2.35'
          - php: '8.4'
            php_version: '8.4.27'
          - php: '8.5'
            php_version: '8.5.12'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        id: prep
        run: |
          DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
          VERSION=latest

          # If this is a git tag, use the tag name as the release version
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          fi

          TAGS="${DOCKER_IMAGE}:php${{ matrix.php }}"
          IMAGE_VERSION="php${{ matrix.php }}"

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAGS="${TAGS},${DOCKER_IMAGE}:${VERSION}-php${{ matrix.php }}"
            IMAGE_VERSION="${VERSION}-php${{ matrix.php }}"
          fi

          # Only PHP 8.5 is tagged as latest
          if [[ "${{ matrix.php }}" == "8.5" ]]; then
            TAGS="${TAGS},${DOCKER_IMAGE}:latest"
            if [[ $GITHUB_REF == refs/tags/* ]]; then
              TAGS="${TAGS},${DOCKER_IMAGE}:${VERSION}"
            fi
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "image_version=${IMAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            VER_PHP=${{ matrix.php_version }}
            VER_DOCKER_IMAGE=${{ steps.prep.outputs.image_version }}
            DISTRO_VER=3.24
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
